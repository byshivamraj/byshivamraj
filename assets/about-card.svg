<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" role="img" aria-label="About Shivam Raj">
  <defs>
    <style>
      .border-trail {
        stroke-dasharray: 220 780;
        animation: trailRun 5s linear infinite;
      }
      @keyframes trailRun {
        0%   { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      .text-1 { animation: blurIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
      .text-2 { animation: blurIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both; }
      .text-3 { animation: blurIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both; }

      @keyframes blurIn {
        0%   { opacity: 0; filter: blur(8px); transform: translateY(8px); }
        100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
      }

      .glow-pulse {
        animation: pulseAura 5s ease-in-out infinite alternate;
      }
      @keyframes pulseAura {
        0%   { opacity: 0.25; }
        100% { opacity: 0.55; }
      }
    </style>

    
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#141417" />
      <stop offset="100%" stop-color="#1E1E24" />
    </linearGradient>

    
    <linearGradient id="multi-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>

    
    <radialGradient id="soft-aura" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="8" y="8" width="1184" height="214" rx="16" fill="url(#dark-bg)" />
  <rect class="glow-pulse" x="8" y="8" width="1184" height="214" rx="16" fill="url(#soft-aura)" />
  <rect x="8" y="8" width="1184" height="214" rx="16" fill="none" stroke="#27272A" stroke-width="1.5" />

  
  <rect class="border-trail" x="8" y="8" width="1184" height="214" rx="16" fill="none" stroke="url(#multi-border)" stroke-width="2.2" stroke-linecap="round" pathLength="1000" filter="url(#glow)" />

  
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    <text class="text-1" x="52" y="60" fill="#A1A1AA" font-size="13" font-weight="700" letter-spacing="3">
      ABOUT ME
    </text>

    <text class="text-2" x="52" y="106" fill="#F4F4F5" font-size="22" font-weight="600">
      Hey, I'm Shivam Raj — a coder and B.Tech CSE (AI &amp; ML) student at Acharya Institute of Technology.
    </text>

    <text class="text-3" x="52" y="144" fill="#A1A1AA" font-size="17" font-weight="400">
      I enjoy turning ideas into clean, working software—writing code across Python, C, C++, HTML, and JavaScript.
    </text>

    <text class="text-3" x="52" y="178" fill="#71717A" font-size="15.5" font-weight="500">
      Always learning, shipping projects, and sharpening my problem-solving one commit at a time.
    </text>
  </g>
</svg>
