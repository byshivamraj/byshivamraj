<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="100%" role="img" aria-label="About Me — Shivam Raj">
  <defs>
    <style>
      .border-trail {
        stroke-dasharray: 240 760;
        animation: trailRun 5s linear infinite;
      }
      @keyframes trailRun {
        0%   { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      .line-1 { animation: fadeSlide 0.7s ease-out 0.1s both; }
      .line-2 { animation: fadeSlide 0.7s ease-out 0.25s both; }
      .line-3 { animation: fadeSlide 0.7s ease-out 0.4s both; }
      .line-4 { animation: fadeSlide 0.7s ease-out 0.55s both; }
      .line-5 { animation: fadeSlide 0.7s ease-out 0.7s both; }
      @keyframes fadeSlide {
        0%   { opacity: 0; transform: translateX(-14px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .aura-shift {
        animation: auraPulse 6s ease-in-out infinite alternate;
      }
      @keyframes auraPulse {
        0%   { opacity: 0.45; }
        100% { opacity: 0.85; }
      }
    </style>

    
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#1B1433" />
    </linearGradient>

    
    <radialGradient id="about-aura" cx="88%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="about-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="about-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="8" y="8" width="1184" height="234" rx="16" fill="url(#about-bg)" />
  <rect class="aura-shift" x="8" y="8" width="1184" height="234" rx="16" fill="url(#about-aura)" />
  <rect x="8" y="8" width="1184" height="234" rx="16" fill="none" stroke="#26334D" stroke-width="1.5" />
  <rect class="border-trail" x="8" y="8" width="1184" height="234" rx="16" fill="none" stroke="url(#about-border)" stroke-width="2.2" stroke-linecap="round" pathLength="1000" filter="url(#about-glow)" />

  
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    <text class="line-1" x="48" y="54" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="3">
      // MORE ABOUT ME
    </text>

    <text class="line-2" x="48" y="96" fill="#F1F5F9" font-size="18" font-weight="500">
      <tspan fill="#00FF9D" font-weight="700">▸  </tspan>Building cool web apps, experiments, and side projects — learning by shipping.
    </text>

    <text class="line-3" x="48" y="132" fill="#E2E8F0" font-size="18" font-weight="500">
      <tspan fill="#00F0FF" font-weight="700">▸  </tspan>Leveraging AI-assisted workflows to turn ideas into working code faster.
    </text>

    <text class="line-4" x="48" y="168" fill="#CBD5E1" font-size="18" font-weight="500">
      <tspan fill="#A855F7" font-weight="700">▸  </tspan>Stack I tinker &amp; build with: Python, C, C++, HTML, and JavaScript.
    </text>

    <text class="line-5" x="48" y="204" fill="#94A3B8" font-size="17" font-weight="500">
      <tspan fill="#EC4899" font-weight="700">▸  </tspan>Always exploring new tech, clean UI designs, and leveling up one commit at a time.
    </text>
  </g>
</svg>
