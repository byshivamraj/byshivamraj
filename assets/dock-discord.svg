<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 56" width="148" height="56" role="img" aria-label="Discord">
  <defs>
    <style>
      .pill { transform-origin: 74px 32px; animation: dockBounce 3.2s ease-in-out 0.8s infinite; }
      @keyframes dockBounce {
        0%, 60%, 100% { transform: translateY(0px) scale(1); }
        25% { transform: translateY(-6px) scale(1.05); }
      }
    </style>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <g class="pill">
    <rect x="6" y="10" width="136" height="40" rx="20" fill="url(#dbg)" stroke="#818CF8" stroke-opacity="0.75" stroke-width="1.5" />
    <text x="74" y="35" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Emoji', sans-serif" font-size="14" font-weight="600">💬  Discord</text>
  </g>
</svg>