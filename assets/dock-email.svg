<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 52" width="138" height="52" role="img" aria-label="Email">
  <defs>
    <style>
      .btn { animation: floatBtn 2.8s ease-in-out 1.2s infinite alternate; }
      @keyframes floatBtn {
        0%   { transform: translateY(2px); }
        100% { transform: translateY(-3px); }
      }
    </style>
  </defs>
  <g class="btn">
    <rect x="4" y="8" width="130" height="36" rx="18" fill="#0F172A" stroke="#00FF9D" stroke-width="1.6" />
    <text x="69" y="31" text-anchor="middle" fill="#F8FAFC" font-family="'Trebuchet MS', 'Segoe UI Emoji', sans-serif" font-size="13.5" font-weight="700">✉️  Email</text>
  </g>
</svg>