<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" width="100%" role="img" aria-label="𝚂𝙷𝙸𝚅𝙰𝙼 𝚁𝙰𝙹 — GitHub Profile Footer">
  <defs>
    <style>
      .footer-beam {
        stroke-dasharray: 220 780;
        animation: beamSlide 5.5s linear infinite;
      }
      @keyframes beamSlide {
        0%   { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      .glow-line {
        animation: linePulse 3.5s ease-in-out infinite alternate;
      }
      @keyframes linePulse {
        0%   { opacity: 0.4; }
        100% { opacity: 1; }
      }

      .status-dot {
        animation: dotBlink 2.2s ease-in-out infinite;
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.25; }
      }
    </style>

    
    <linearGradient id="f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#0B2230" />
    </linearGradient>

    
    <linearGradient id="f-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    
    <linearGradient id="f-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    
    <pattern id="f-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00F0FF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="8" y="8" width="1184" height="76" rx="14" fill="url(#f-bg)" />
  <rect x="8" y="8" width="1184" height="76" rx="14" fill="url(#f-grid)" />
  <rect x="8" y="8" width="1184" height="76" rx="14" fill="none" stroke="#163047" stroke-width="1.5" />

  
  <rect class="footer-beam" x="8" y="8" width="1184" height="76" rx="14" fill="none" stroke="url(#f-neon)" stroke-width="2" stroke-linecap="round" pathLength="1000" filter="url(#f-glow)" />

  
  <rect class="glow-line" x="300" y="8" width="600" height="2" fill="url(#f-accent)" filter="url(#f-glow)" />

  
  <circle class="status-dot" cx="44" cy="46" r="3.5" fill="#00FF9D" filter="url(#f-glow)" />
  <circle class="status-dot" cx="1156" cy="46" r="3.5" fill="#00F0FF" filter="url(#f-glow)" />

  
  <text x="600" y="51" text-anchor="middle" fill="#E2E8F0" font-family="&#39;Consolas&#39;, &#39;Segoe UI Symbol&#39;, monospace" font-size="14" font-weight="600" letter-spacing="2.8">
    <tspan fill="#00F0FF">𝚂𝙷𝙸𝚅𝙰𝙼 𝚁𝙰𝙹</tspan>
    <tspan fill="#475569">  //  </tspan>
    <tspan fill="#CBD5E1">THANKS FOR VISITING</tspan>
    <tspan fill="#475569">  //  </tspan>
    <tspan fill="#00FF9D">GITHUB.COM/BYSHIVAMRAJ</tspan>
  </text>
</svg>
