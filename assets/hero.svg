<svg width="100%" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070D" />
      <stop offset="50%" stop-color="#0E0B1A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A855F7" stroke-opacity="0.12" stroke-width="1" />
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1000" height="260" rx="14" fill="url(#bg-grad)" />
  <rect width="1000" height="260" rx="14" fill="url(#cyber-grid)" />
  <rect width="1000" height="260" rx="14" fill="url(#sweep)" />
  <rect x="1" y="1" width="998" height="258" rx="13" stroke="url(#neon-line)" stroke-opacity="0.45" stroke-width="1.5" />

  
  <circle cx="840" cy="130" r="78" stroke="#00F0FF" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="0 840 130" to="360 840 130" dur="28s" repeatCount="indefinite" />
  </circle>
  <circle cx="840" cy="130" r="52" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="14 8">
    <animateTransform attributeName="transform" type="rotate" from="360 840 130" to="0 840 130" dur="18s" repeatCount="indefinite" />
  </circle>
  <circle cx="840" cy="130" r="6" fill="#00F0FF" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
  </circle>

  
  <rect x="55" y="42" width="215" height="26" rx="13" fill="#131124" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="72" cy="55" r="4" fill="#00F0FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="86" y="59" fill="#CBD5E1" font-family="&#39;Segoe UI&#39;, Consolas, monospace" font-size="11.5" letter-spacing="1.2">SYSTEM.ONLINE // BLR</text>

  
  <text x="55" y="132" fill="#F8FAFC" font-family="&#39;Segoe UI&#39;, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="1.5">SHIVAM RAJ</text>
  <text x="55" y="168" fill="#C084FC" font-family="&#39;Segoe UI&#39;, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="0.8">
    AI/ML Engineering Student  •  Cybersecurity  •  Full-Stack Builder
  </text>

  
  <path d="M55 188 L490 188" stroke="url(#neon-line)" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)" stroke-dasharray="435" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="435;0;0" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite" />
  </path>

  
  <text x="55" y="220" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Consolas, monospace" font-size="13">
    B.Tech CSE (AI &amp; ML) @ Acharya Institute of Technology  |  Building Autonomous AI &amp; Security Tools
  </text>
</svg>
