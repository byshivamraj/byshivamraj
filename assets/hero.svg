<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" width="100%" role="img" aria-label="Shivam Raj — GitHub Profile Footer">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>
    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" stop-opacity="0" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="84" rx="12" fill="url(#footer-bg)" />
  <rect x="1" y="1" width="1198" height="82" rx="11" fill="none" stroke="#451126" stroke-width="1.2" />

  
  <rect x="200" y="1" width="800" height="2" fill="url(#footer-line)">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="5s" repeatCount="indefinite" />
  </rect>

  <text x="600" y="47" text-anchor="middle" fill="#E5B5C7" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="3">
    SHIVAM RAJ  •  CRAFTING INTELLIGENT SYSTEMS &amp; SECURE CODE
  </text>
</svg>
