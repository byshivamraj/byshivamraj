<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Shivam Raj — Coder | Acharya Institute of Technology | B.Tech CSE (AI &amp; ML)">
  <defs>
    <style>
      .word-1 { animation: blurReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
      .word-2 { animation: blurReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
      .word-3 { animation: blurReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both; }
      .word-4 { animation: blurReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.85s both; }

      @keyframes blurReveal {
        0% {
          opacity: 0;
          filter: blur(10px);
          transform: translateY(8px);
        }
        100% {
          opacity: 1;
          filter: blur(0px);
          transform: translateY(0px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .word-1, .word-2, .word-3, .word-4 {
          animation: none;
          opacity: 1;
          filter: none;
          transform: none;
        }
      }
    </style>

    
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="55%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#2A0B18" />
    </linearGradient>

    
    <radialGradient id="glow-1" cx="18%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FF2E54" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-2" cx="82%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#C959DD" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#701A3D" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-3" cx="55%" cy="85%" r="38%">
      <stop offset="0%" stop-color="#0894FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0" />
      <stop offset="35%" stop-color="#FF2E54" />
      <stop offset="70%" stop-color="#E5B5C7" />
      <stop offset="100%" stop-color="#F8F0F3" />
    </linearGradient>

    
    <linearGradient id="underline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B" />
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.15" />
    </linearGradient>

    
    <pattern id="hero-grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    
    <filter id="soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="url(#hero-bg)" />
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="url(#hero-grid)" />

  
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="url(#glow-1)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite" />
  </rect>
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="url(#glow-2)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="url(#glow-3)">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="9s" repeatCount="indefinite" />
  </rect>

  
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1.5" />

  
  <rect x="8" y="8" width="1184" height="324" rx="18" fill="none" stroke="url(#trail-grad)" stroke-width="2.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="140 860" filter="url(#soft-glow)">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5.5s" repeatCount="indefinite" />
  </rect>

  
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    
    <g class="word-1">
      <rect x="64" y="56" width="96" height="28" rx="14" fill="#451126" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="80" cy="70" r="3.5" fill="#FF2E54" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="92" y="74.5" fill="#F8F0F3" font-size="12" font-weight="600" letter-spacing="2.2">CODER</text>
    </g>

    
    <text x="64" y="156" fill="#F8F0F3" font-size="62" font-weight="800" letter-spacing="2.5">
      <tspan class="word-1">SHIVAM</tspan>
      <tspan class="word-2" dx="14" fill="#E5B5C7">RAJ</tspan>
    </text>

    
    <rect x="64" y="176" width="330" height="3.5" rx="2" fill="url(#underline-grad)" filter="url(#soft-glow)">
      <animate attributeName="width" values="290;370;290" dur="5.5s" repeatCount="indefinite" />
    </rect>

    
    <text x="64" y="222" fill="#F8F0F3" font-size="20" font-weight="600" letter-spacing="0.4" class="word-3">
      Acharya Institute of Technology
    </text>
    <text x="64" y="254" fill="#C77B9B" font-size="16" font-weight="500" letter-spacing="1.2" class="word-4">
      B.TECH CSE (AI &amp; ML)
    </text>
  </g>

  
  <g transform="translate(855, 68)">
    
    <rect x="-4" y="-4" width="268" height="204" rx="16" fill="none" stroke="#C959DD" stroke-opacity="0.35" stroke-width="4" filter="url(#soft-glow)">
      <animate attributeName="stroke" values="#0894FF;#C959DD;#FF2E54;#FF9004;#0894FF" dur="8s" repeatCount="indefinite" />
    </rect>

    
    <rect x="0" y="0" width="260" height="196" rx="14" fill="#10070C" fill-opacity="0.88" stroke="#701A3D" stroke-width="1.2" />

    
    <circle cx="130" cy="96" r="56" fill="none" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />
    <ellipse cx="130" cy="96" rx="78" ry="30" fill="none" stroke="#E5B5C7" stroke-opacity="0.22" stroke-width="1" transform="rotate(-18 130 96)" />

    
    <g transform="translate(198, 138) scale(0.65)" fill="none" stroke="#E5B5C7" stroke-linecap="round" stroke-width="3">
      <path d="M51.883 26.495c-7.277-4.124-18.08-7.004-26.519-7.425-2.357-.118-4.407-.244-6.364 1.06M59.642 51c-10.47-7.25-26.594-13.426-39.514-15.664-3.61-.625-6.744-1.202-9.991.263" />
    </g>

    
    <text x="20" y="34" fill="#C77B9B" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2">
      @BYSHIVAMRAJ
    </text>

    
    <g>
      <animateTransform attributeName="transform" type="translate" values="35,155; 112,86; 112,86; 195,48; 35,155" keyTimes="0; 0.3; 0.65; 0.85; 1" dur="6s" repeatCount="indefinite" />

      
      <rect x="-12" y="-16" width="84" height="32" rx="16" fill="#F8F0F3" fill-opacity="0.18" stroke="#E5B5C7" stroke-opacity="0.6" stroke-width="1">
        <animate attributeName="width" values="18;84;84;18;18" keyTimes="0;0.3;0.65;0.85;1" dur="6s" repeatCount="indefinite" />
        <animate attributeName="height" values="18;32;32;18;18" keyTimes="0;0.3;0.65;0.85;1" dur="6s" repeatCount="indefinite" />
        <animate attributeName="y" values="-9;-16;-16;-9;-9" keyTimes="0;0.3;0.65;0.85;1" dur="6s" repeatCount="indefinite" />
      </rect>

      
      <text x="6" y="4.5" fill="#F8F0F3" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="600">
        More +
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.32;0.63;0.8;1" dur="6s" repeatCount="indefinite" />
      </text>

      
      <path d="M-16,-14 L-16,4 L-11,-1 L-6,5 L-3,3 L-8,-3 L-2,-4 Z" fill="#F8F0F3" stroke="#10070C" stroke-width="1" />
    </g>
  </g>
</svg>
