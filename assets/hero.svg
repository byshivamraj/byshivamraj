<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="𝚂𝙷𝙸𝚅𝙰𝙼 𝚁𝙰𝙹 — Coder | Acharya Institute of Technology | B.Tech CSE (AI &amp; ML)">
  <defs>
    <style>
      /* Name Animation on Profile Load + Continuous Neon Pulse */
      .name-reveal {
        animation: nameEntrance 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                   neonBreathe 3s ease-in-out 1.1s infinite alternate;
      }
      @keyframes nameEntrance {
        0%   { opacity: 0; filter: blur(12px); transform: translateY(14px) scale(0.96); }
        100% { opacity: 1; filter: blur(0px); transform: translateY(0px) scale(1); }
      }
      @keyframes neonBreathe {
        0%   { filter: drop-shadow(0 0 6px #00F0FF) drop-shadow(0 0 16px #00FF9D); }
        100% { filter: drop-shadow(0 0 12px #00F0FF) drop-shadow(0 0 28px #00FF9D); }
      }

      /* Staggered Info Reveal */
      .reveal-1 { animation: slideIn 0.7s ease-out 0.15s both; }
      .reveal-2 { animation: slideIn 0.7s ease-out 0.55s both; }
      .reveal-3 { animation: slideIn 0.7s ease-out 0.75s both; }
      @keyframes slideIn {
        0%   { opacity: 0; transform: translateX(-16px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      /* Outer Border Beam */
      .border-beam {
        stroke-dasharray: 220 780;
        animation: beamRun 5.5s linear infinite;
      }
      @keyframes beamRun {
        0%   { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      /* Pixel Character Animations */
      .char-bob {
        animation: charBreathe 3.2s ease-in-out infinite alternate;
      }
      @keyframes charBreathe {
        0%   { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }

      .eye-blink {
        transform-origin: 966px 142px;
        animation: blink 4.8s infinite;
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96%           { transform: scaleY(0.1); }
      }

      .snow-fall-1 { animation: snowDrop 4.5s linear infinite; }
      .snow-fall-2 { animation: snowDrop 5.5s linear 1.8s infinite; }
      @keyframes snowDrop {
        0%   { transform: translateY(-10px); opacity: 0; }
        15%  { opacity: 0.9; }
        85%  { opacity: 0.9; }
        100% { transform: translateY(95px); opacity: 0; }
      }

      .steam-rise {
        animation: steamAnim 2.4s ease-in-out infinite;
      }
      @keyframes steamAnim {
        0%   { transform: translateY(4px); opacity: 0; }
        50%  { opacity: 0.7; }
        100% { transform: translateY(-10px); opacity: 0; }
      }

      .code-blink {
        animation: codePulse 2s ease-in-out infinite alternate;
      }
      @keyframes codePulse {
        0%   { opacity: 0.45; }
        100% { opacity: 1; }
      }
    </style>

    
    <linearGradient id="bg-night" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#0B2230" />
    </linearGradient>

    
    <linearGradient id="neon-cyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    
    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00F0FF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    
    <clipPath id="scene-clip">
      <rect x="824" y="28" width="324" height="264" rx="16" />
    </clipPath>

    
    <filter id="neon-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="8" y="8" width="1184" height="304" rx="18" fill="url(#bg-night)" />
  <rect x="8" y="8" width="1184" height="304" rx="18" fill="url(#cyber-grid)" />
  <rect x="8" y="8" width="1184" height="304" rx="18" fill="none" stroke="#163047" stroke-width="1.5" />
  <rect class="border-beam" x="8" y="8" width="1184" height="304" rx="18" fill="none" stroke="url(#neon-cyber)" stroke-width="2.2" stroke-linecap="round" pathLength="1000" filter="url(#neon-glow)" />

  
