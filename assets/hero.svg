<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Shivam Raj — AI/ML Engineer, Security Tooling, Full-Stack Developer">
  <defs>
    
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C">
        <animate attributeName="stop-color" values="#10070C;#190B12;#10070C" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#451126">
        <animate attributeName="stop-color" values="#451126;#701A3D;#451126" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    
    <radialGradient id="hero-ambient" cx="82%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#451126" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="hero-underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" />
      <stop offset="50%" stop-color="#C77B9B" />
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.1" />
    </linearGradient>

    
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    
    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1200" height="320" rx="16" fill="url(#hero-bg)" />
  <rect x="0" y="0" width="1200" height="320" rx="16" fill="url(#hero-grid)" />
  <rect x="0" y="0" width="1200" height="320" rx="16" fill="url(#hero-ambient)" />
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#701A3D" stroke-opacity="0.55" stroke-width="1.5" />

  
  <g transform="translate(970, 160)" opacity="0.85">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />
    <ellipse cx="0" cy="0" rx="135" ry="52" fill="none" stroke="#E5B5C7" stroke-opacity="0.22" stroke-width="1.2" transform="rotate(-22)" />
    <ellipse cx="0" cy="0" rx="85" ry="34" fill="none" stroke="#701A3D" stroke-opacity="0.65" stroke-width="1.2" transform="rotate(28)" />
    <circle cx="0" cy="0" r="6" fill="#E5B5C7" filter="url(#hero-glow)">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <circle r="3.5" fill="#F8F0F3" filter="url(#hero-glow)">
      <animateMotion dur="12s" repeatCount="indefinite" path="M -125,48 A 135,52 -22 1,1 125,-48 A 135,52 -22 1,1 -125,48" />
    </circle>
  </g>

  
  <path d="M 64 268 Q 220 245, 360 268 T 660 268 T 960 260 T 1136 268" fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="180 900">
    <animate attributeName="stroke-dashoffset" from="1080" to="0" dur="7s" repeatCount="indefinite" />
  </path>

  
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    
    <text x="68" y="88" fill="#C77B9B" font-size="13" font-weight="600" letter-spacing="3.5">
      BENGALURU, INDIA  •  B.TECH CSE (AI &amp; ML)
    </text>

    
    <text x="64" y="158" fill="#F8F0F3" font-size="58" font-weight="700" letter-spacing="2">
      SHIVAM RAJ
    </text>

    
    <rect x="68" y="176" width="320" height="3" rx="1.5" fill="url(#hero-underline)" filter="url(#hero-glow)">
      <animate attributeName="width" values="280;340;280" dur="6s" repeatCount="indefinite" />
    </rect>

    
    <text x="68" y="218" fill="#E5B5C7" font-size="19" font-weight="400" letter-spacing="0.8">
      AI/ML Developer  |  Security Tooling  |  Full-Stack Builder
    </text>
  </g>
</svg>
