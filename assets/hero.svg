<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="100%" role="img" aria-label="𝚂𝙷𝙸𝚅𝙰𝙼 𝚁𝙰𝙹 — Coder | Acharya Institute of Technology | B.Tech CSE (AI &amp; ML)">
  <defs>
    <style>
      .name-in {
        animation: fadeSlide 0.8s ease-out both;
      }
      .info-in {
        animation: fadeSlide 0.8s ease-out 0.25s both;
      }
      @keyframes fadeSlide {
        0%   { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .eye-blink {
        transform-origin: 682px 124px;
        animation: blink 4.5s infinite;
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96%           { transform: scaleY(0.1); }
      }
    </style>

    <linearGradient id="bg-night" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#0B2230" />
    </linearGradient>

    <linearGradient id="neon-cyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <clipPath id="scene-clip">
      <rect x="572" y="24" width="244" height="222" rx="16" />
