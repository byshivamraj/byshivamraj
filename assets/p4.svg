<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 185" width="100%" role="img" aria-label="OLD PROJECT">
  <defs>
    <style>
      .beam { stroke-dasharray: 180 820; animation: run 5.5s linear 3.6s infinite; }
      @keyframes run { 0% { stroke-dashoffset: 1000; } 100% { stroke-dashoffset: 0; } }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#171C30" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="572" height="177" rx="16" fill="url(#bg)" stroke="#24314A" stroke-width="1.5" />
  <rect class="beam" x="4" y="4" width="572" height="177" rx="16" fill="none" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" pathLength="1000" />
  <circle class="dot" cx="32" cy="36" r="4.5" fill="#F59E0B" />
  <text x="46" y="40" fill="#F59E0B" font-family="'Consolas', monospace" font-size="12" font-weight="700" letter-spacing="2">OLD PROJECT</text>
  <text x="28" y="80" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Archive Build</text>
  <text x="28" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">An older project from my learning journey.</text>
  <rect x="28" y="128" width="136" height="34" rx="17" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5" />
  <text x="96" y="149.5" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">View Repo ↗</text>
</svg>